_schema-version: '3.1'
ID: dsp-scim-handler
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: dsp-scim-handler-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
      command: npm run start:prod
      random-route: true
    properties:
      DSP_SCIM_TOKEN_URL: "https://acea-datasphere.authentication.eu30.hana.ondemand.com/oauth/token"
      DSP_SCIM_BASE_URL: "https://acea-datasphere.eu30.hcs.cloud.sap/"
      DSP_SCIM_CLIENT_ID: "sb-da5cd35b-f5de-4866-855b-20a3070e81d2!b40601|client!b179"
      DSP_SCIM_CLIENT_SECRET: "976f8698-c886-4576-b6e8-72a1ef46fb33$3Gk6kWcY9W7jhipIxBJgYv3dqpgnKhTG5_Jh5Wl4GWk="
    requires:
      - name: dsp_scim_handler-db
      - name: xsuaa-dsp-scim-handler

  - name: dsp_scim_handler-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: dsp_scim_handler-db
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}

resources:
  - name: xsuaa-dsp-scim-handler
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
  - name: dsp_scim_handler-db
    type: com.sap.xs.hdi-container
    parameters:
      service-name: SCIM_UTILITIES
      config:
        schema: SCIM_UTILITIES
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}


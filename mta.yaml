_schema-version: '3.1'
ID: dsp-scim-handler
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: dsp-scim-handler-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
      command: npm run start:prod
      random-route: true
    properties:
      DSP_SCIM_TOKEN_URL: "https://acea-devdatasphere.authentication.eu30.hana.ondemand.com/oauth/token"
      DSP_SCIM_BASE_URL: "https://acea-devdatasphere.eu30.hcs.cloud.sap/"
      DSP_SCIM_CLIENT_ID: "sb-36753c0b-5a8c-41b4-ab7e-299a916b9e86!b32455|client!b179"
      DSP_SCIM_CLIENT_SECRET: "b39121e8-865d-48e1-8485-ebda477ba2e7$WOI7qacc5TpxiDtr4-SvUTWhXdxJj_EaQfNByA2Bero="
    requires:
      - name: dsp_scim_handler-db
      - name: xsuaa-dsp-scim-handler

  - name: dsp_scim_handler-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: dsp_scim_handler-db
        properties:
          TARGET_CONTAINER: ~{hdi-container-name}

resources:
  - name: xsuaa-dsp-scim-handler
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
  - name: dsp_scim_handler-db
    type: com.sap.xs.hdi-container
    parameters:
      service-name: SCIM_UTILITIES
      config:
        schema: SCIM_UTILITIES
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-name: ${service-name}

